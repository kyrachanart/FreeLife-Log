
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <filter id="subtle-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Outer Green Circle -->
  <circle cx="256" cy="256" r="236" fill="#608b68" />

  <!-- Inner Cream Clock Face -->
  <circle cx="256" cy="256" r="176" fill="#f8f5eb" />

  <!-- 12 Clock Ticks -->
  <!-- 12 o'clock -->
  <rect x="247" y="108" width="18" height="32" rx="9" fill="#4d4d4d" />
  <!-- 1 o'clock -->
  <rect x="247" y="108" width="18" height="32" rx="9" fill="#4d4d4d" transform="rotate(30 256 256)" />
  <!-- 2 o'clock -->
  <rect x="247" y="108" width="18" height="32" rx="9" fill="#4d4d4d" transform="rotate(60 256 256)" />
  <!-- 3 o'clock -->
  <rect x="247" y="108" width="18" height="32" rx="9" fill="#4d4d4d" transform="rotate(90 256 256)" />
  <!-- 4 o'clock -->
  <rect x="247" y="108" width="18" height="32" rx="9" fill="#4d4d4d" transform="rotate(120 256 256)" />
  <!-- 5 o'clock -->
  <rect x="247" y="108" width="18" height="32" rx="9" fill="#4d4d4d" transform="rotate(150 256 256)" />
  <!-- 6 o'clock -->
  <rect x="247" y="108" width="18" height="32" rx="9" fill="#4d4d4d" transform="rotate(180 256 256)" />
  <!-- 7 o'clock -->
  <rect x="247" y="108" width="18" height="32" rx="9" fill="#4d4d4d" transform="rotate(210 256 256)" />
  <!-- 8 o'clock -->
  <rect x="247" y="108" width="18" height="32" rx="9" fill="#4d4d4d" transform="rotate(240 256 256)" />
  <!-- 9 o'clock -->
  <rect x="247" y="108" width="18" height="32" rx="9" fill="#4d4d4d" transform="rotate(270 256 256)" />
  <!-- 10 o'clock -->
  <rect x="247" y="108" width="18" height="32" rx="9" fill="#4d4d4d" transform="rotate(300 256 256)" />
  <!-- 11 o'clock -->
  <rect x="247" y="108" width="18" height="32" rx="9" fill="#4d4d4d" transform="rotate(330 256 256)" />

  <!-- Clock Hands (Pencils) -->
  <!-- Minute Hand Pencil pointing to ~2 o'clock (60 deg from top) -->
  <g transform="translate(256, 256) rotate(58)">
    <!-- Yellow Shaft -->
    <rect x="-13" y="-125" width="26" height="110" rx="3" fill="#f4c038" />
    <!-- Metal Ferrule / Collar line -->
    <rect x="-13" y="-20" width="26" height="8" fill="#e0a520" />
    <!-- Wood Cone Tip -->
    <polygon points="-13,-125 13,-125 0,-155" fill="#f3cb98" />
    <!-- Lead Tip -->
    <polygon points="-5,-143 5,-143 0,-155" fill="#3d3d3d" />
  </g>

  <!-- Hour Hand Pencil pointing to ~10 o'clock (-60 deg from top) -->
  <g transform="translate(256, 256) rotate(-58)">
    <!-- Yellow Shaft (Shorter) -->
    <rect x="-13" y="-95" width="26" height="80" rx="3" fill="#f4c038" />
    <!-- Metal Ferrule / Collar line -->
    <rect x="-13" y="-20" width="26" height="8" fill="#e0a520" />
    <!-- Wood Cone Tip -->
    <polygon points="-13,-95 13,-95 0,-125" fill="#f3cb98" />
    <!-- Lead Tip -->
    <polygon points="-5,-113 5,-113 0,-125" fill="#3d3d3d" />
  </g>

  <!-- Center Pin (Green circle with cream center) -->
  <circle cx="256" cy="256" r="22" fill="#608b68" filter="url(#subtle-shadow)" />
  <circle cx="256" cy="256" r="10" fill="#f8f5eb" />
</svg>
